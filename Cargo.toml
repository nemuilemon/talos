[package]
name = "talos"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
